<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quetta Admin</title><link rel="stylesheet" href="/style.css"></head><body><main class="admin"><h1>Quetta Admin Panel</h1><section id="login" class="panel"><h2>Admin Login</h2><div class="row"><input id="u" placeholder="Username"><input id="p" type="password" placeholder="Password"><button onclick="doLogin()">Login</button></div><p id="lm"></p></section><section id="dash" style="display:none"><div class="panel"><h2>Create Password</h2><div class="row"><select id="days"><option value="1">1 Day</option><option value="90">3 Months</option><option value="180">6 Months</option></select><button onclick="createKey()">Generate Password</button><button onclick="logout()">Logout</button></div><p id="newKey"></p></div><div class="panel"><h2>Passwords</h2><table class="table"><thead><tr><th>Password</th><th>Plan</th><th>Activated</th><th>Expires</th><th>Status</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>async function api(url,opt){const r=await fetch(url,opt);const d=await r.json();if(!r.ok)throw new Error(d.error||'Error');return d}async function doLogin(){try{await api('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u.value,password:p.value})});document.getElementById('login').style.display='none';document.getElementById('dash').style.display='block';load()}catch(e){lm.textContent=e.message}}async function load(){const data=await api('/api/admin/licenses');rows.innerHTML=data.map(x=>{let status=x.revoked_at?'Revoked':x.expires_at&&new Date(x.expires_at)<=new Date()?'Expired':x.activated_at?'Active':'Unused';return `<tr><td><b>${x.code}</b></td><td>${x.duration_days===1?'1 Day':x.duration_days===90?'3 Months':'6 Months'}</td><td>${x.activated_at?new Date(x.activated_at).toLocaleString():'—'}</td><td>${x.expires_at?new Date(x.expires_at).toLocaleString():'Starts on activation'}</td><td>${status}</td><td>${!x.revoked_at&&status!=='Expired'?`<button class="danger" onclick="revoke('${x.code}')">Revoke</button>`:''}</td></tr>`}).join('')}async function createKey(){try{const x=await api('/api/admin/licenses',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({durationDays:Number(days.value)})});newKey.textContent='New password: '+x.code;await load()}catch(e){newKey.textContent=e.message}}async function revoke(c){if(!confirm('Revoke '+c+'?'))return;await api('/api/admin/licenses/'+encodeURIComponent(c)+'/revoke',{method:'POST'});load()}async function logout(){await api('/api/admin/logout',{method:'POST'});location.reload()}</script></body></html>
