<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quetta</title><link rel="stylesheet" href="/style.css"></head>
<body>
<div class="app-shell">
  <header class="top"><div class="brand">Quetta</div><button class="edit" aria-label="Edit">✎</button></header>
  <main id="main" class="home locked">
    <section class="apps">
      <button class="app-card" data-action="openWhatsApp"><span class="wa">◔</span><small>WhatsApp</small></button>
      <button class="app-card" data-action="openBusiness"><span class="wa biz">◔</span><small>whatsappbu<br>siness</small></button>
      <button class="app-card add" data-action="add"><span>＋</span><small>Add</small></button>
    </section>
    <section class="extensions">
      <div class="ext-title"><span>Quetta Extensions</span><span class="grid">▦</span></div>
      <button class="extension" data-action="extension"><span class="ext-icon">B</span><b>BOSS Premium Mic</b><span class="arrow">›</span></button>
      <button class="manage" data-action="manage">Manage Extensions</button>
      <div class="powered">✥ Powered by Quetta</div>
    </section>
  </main>
</div>
<div id="activation" class="modal"><div class="modal-card"><div class="modal-brand">Quetta</div><h1>Activate Access</h1><p>Enter your BOSS password to unlock the app.</p><input id="code" placeholder="BOSS-1D-XXXXXXXX" autocomplete="off"><button id="activateBtn">Activate</button><div id="activationMsg"></div><div class="plans"><span>1 Day</span><span>3 Months</span><span>6 Months</span></div></div></div>
<div id="toast"></div>
<script src="/app.js"></script>
</body></html>
