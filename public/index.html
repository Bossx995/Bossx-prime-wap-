<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020718"><title>Bossx Mic prime</title><link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app-shell">
  <header class="topbar"><div class="brand">Bossx Mic prime</div><button class="edit" aria-label="Edit">⌕</button></header>
  <main id="main" class="home locked">
    <section class="apps">
      <button class="app-card" data-action="openWhatsApp"><span class="wa-icon whatsapp-icon">⌕</span><small>WhatsApp</small></button>
      <button class="app-card" data-action="openBusiness"><span class="wa-icon business-icon">⌕</span><small>whatsappbu<br>siness</small></button>
      <button class="app-card add" data-action="add"><span>＋</span><small>Add</small></button>
    </section>
    <section class="extensions">
      <div class="ext-title"><span>Quetta Extensions</span><span class="grid">▦</span></div>
      <button class="extension" data-action="extension"><span class="ext-icon">B</span><b>Bossx Mic prime</b><span class="arrow">›</span></button>
      <button class="manage" data-action="manage">Manage Extensions</button>
      <div class="powered">✣ Powered by Quetta</div>
    </section>
  </main>
</div>

<div id="activation" class="modal" role="dialog" aria-modal="true">
  <div class="activation-card">
    <div class="modal-brand">Bossx Mic prime</div>
    <div class="activation-kicker">PREMIUM ACCESS</div>
    <h1>Activate Access</h1>
    <p>Enter your BOSS password to unlock the app.</p>
    <div class="code-wrap"><span>🔐</span><input id="code" placeholder="BOSS-1D-XXXXXXXX" autocomplete="off" autocapitalize="characters"></div>
    <button id="activateBtn" class="primary-btn">Activate Access</button>
    <div id="activationMsg"></div>
    <div class="telegram-box">
      <div class="telegram-title">💎 Buy Premium / Unlimited</div>
      <div class="telegram-text">1 Day / 6 Months শেষ হলে Unlimited কিনতে Telegram-এ মেসেজ করুন।</div>
      <a href="https://t.me/BOSSX929" target="_blank" rel="noopener" class="telegram-link">✈️ @BOSSX929</a>
    </div>
    <div class="plan-row" aria-label="Choose plan">
      <button type="button" class="plan-option" data-plan="1D"><b>1 Day</b><small>Short Term</small></button>
      <button type="button" class="plan-option" data-plan="6M"><b>6 Months</b><small>Best Value</small></button>
      <button type="button" class="plan-option" data-plan="UNL"><b>Unlimited</b><small>Lifetime</small></button>
    </div>
  </div>
</div>
<div id="toast"></div>
<script src="/app.js"></script>
</body></html>
